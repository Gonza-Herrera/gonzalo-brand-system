<gh-section id="experience" spacing="lg" surface="transparent">
  <gh-container size="lg">
    <gh-stack gap="xl">
      <gh-section-heading
        [eyebrow]="content().eyebrow"
        [title]="content().title"
        [description]="content().description"
        [headingLevel]="2"
      >
        <a ghSectionHeadingAction class="home-section-action" [href]="viewAllAction().href">
          {{ viewAllAction().label }}
        </a>
      </gh-section-heading>

      <gh-experience-timeline
        [experiences]="content().items"
        [cardLabels]="content().cardLabels"
        [cardHeadingLevel]="3"
        orientation="compact"
        [showConnector]="content().items.length > 1"
      />
    </gh-stack>
  </gh-container>
</gh-section>
