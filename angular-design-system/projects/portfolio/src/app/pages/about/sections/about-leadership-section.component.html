<gh-section id="leadership-approach" spacing="lg" surface="transparent">
  <gh-container size="xl">
    <gh-stack gap="xl">
      <gh-section-heading
        [eyebrow]="content().eyebrow"
        [title]="content().title"
        [headingLevel]="2"
      />
      <gh-stack class="about-leadership__copy" gap="md">
        @for (paragraph of content().paragraphs; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </gh-stack>
      <gh-feature-grid
        [features]="content().practices"
        [externalLinkLabel]="externalLinkLabel()"
        [columns]="3"
        variant="cards"
      />
    </gh-stack>
  </gh-container>
</gh-section>
