<label class="theme-switcher">
  <span>{{ label() }}</span>
  <select class="gh-select" [value]="preference()" (change)="setTheme($event)">
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === preference()">
        {{ option.label }}
      </option>
    }
  </select>
</label>
