<article
  [class]="cardClasses()"
  [attr.aria-label]="ariaLabel()"
  [attr.data-variant]="variant()"
  [attr.data-padding]="padding()"
  [attr.data-radius]="radius()"
  [attr.data-interactive]="interactive() ? 'true' : null"
  [attr.data-selected]="selected() ? 'true' : null"
  [attr.data-full-height]="fullHeight() ? 'true' : null"
>
  <div class="gh-card__media">
    <ng-content select="[ghCardMedia]" />
  </div>

  <div class="gh-card__body">
    <div class="gh-card__header">
      <ng-content select="[ghCardHeader]" />
    </div>

    <div class="gh-card__content">
      <ng-content select="[ghCardContent]" />
    </div>

    <ng-content />

    <div class="gh-card__footer">
      <ng-content select="[ghCardFooter]" />
    </div>
  </div>
</article>
