<fieldset class="theme-toggle">
  <legend class="gh-visually-hidden">Theme preference</legend>

  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="preference() === option.value"
      [attr.title]="
        option.value === 'system'
          ? 'Follow the operating system theme'
          : 'Use the ' + option.label.toLowerCase() + ' theme'
      "
      (click)="setTheme(option.value)"
    >
      {{ option.label }}
    </button>
  }

  <span class="gh-visually-hidden" aria-live="polite"> Resolved theme: {{ resolvedTheme() }} </span>
</fieldset>
