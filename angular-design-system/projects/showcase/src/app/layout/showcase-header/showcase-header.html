<header class="header">
  <a class="brand" routerLink="/" aria-label="Gonzalo Herrera Design System overview">
    <span class="brand__mark" aria-hidden="true">GH</span>
    <span>
      <strong>Gonzalo Herrera</strong>
      <small>Design System</small>
    </span>
  </a>

  <div class="header__actions">
    <showcase-theme-toggle />
    <gh-icon-button
      #menuToggle
      class="menu-toggle"
      variant="secondary"
      size="md"
      aria-controls="showcase-navigation"
      [aria-expanded]="menuOpen()"
      [aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
      (click)="menuToggled.emit()"
    >
      @if (menuOpen()) {
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
          <path d="M6 6L18 18M18 6L6 18" />
        </svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
          <path d="M4 7H20M4 12H20M4 17H20" />
        </svg>
      }
    </gh-icon-button>
  </div>
</header>
